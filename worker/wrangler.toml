name = "ai-study-grader"
main = "src/index.js"
compatibility_date = "2026-04-22"

# Workers 무료 플랜 사용 (10만 요청/일)
workers_dev = true

[observability]
enabled = true

# Secrets는 CLI로 주입 (wrangler secret put …)
#   [/grade-text 기존 서술형] LLM_API_KEY = "up_..."  (LLM_PROVIDER=upstage, LLM_MODEL=solar-mini)
#   [/grade 신규 작업형·서술형] OLLAMA_URL = "https://…cloudflared 터널",  LLM_PROXY_TOKEN = "…proxy.py Bearer"
#
# 공개 가능한 설정(여기 직접 적어도 되는 것)
[vars]
ALLOWED_ORIGINS = "https://repairer5812.github.io,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500"
RATE_LIMIT_PER_MINUTE = "20"
MAX_REQUEST_BYTES = "16384"
# /grade(작업형·서술형) 로컬 LLM: Ollama 터널 경유 qwen3.5:4b
OLLAMA_MODEL = "qwen3.5:9b"
