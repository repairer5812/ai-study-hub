<!DOCTYPE html>
<html lang="ko" data-theme="bento">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="SW AI 융합정보대학원 61기 최경찬">
<meta name="description" content="AI Study Hub — 인공지능 스터디 허브 · 복습 + 모의고사 + 랭킹">
<meta property="og:title" content="AI Study Hub">
<meta property="og:description" content="인공지능 스터디 허브 · 과목별 복습 노트 + 모의고사">
<meta property="og:type" content="website">
<meta name="theme-color" content="#181D27">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>AI Study Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Study Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-bento.css">
<link rel="stylesheet" href="css/theme-dark.css">
<style>
  /* ── 홈 히어로 (좌측 정렬, 절제) ── */
  .home-hero { padding:48px 0 8px; max-width:640px; }
  .home-hero .home-kicker {
    display:inline-flex; align-items:center; gap:8px;
    font-family:"JetBrains Mono", ui-monospace, monospace;
    font-size:12px; font-weight:600; letter-spacing:0.02em;
    color:var(--c-text); margin-bottom:18px;
  }
  .home-hero .home-kicker .dot { width:6px; height:6px; border-radius:50%; background:var(--c-accent); }
  .home-hero h1 {
    font-size:clamp(30px, 5vw, 44px); font-weight:800; line-height:1.18;
    letter-spacing:-0.02em; color:var(--c-heading); text-wrap:balance; word-break:keep-all;
  }
  .home-hero p { margin-top:14px; font-size:17px; color:var(--c-text); line-height:1.6; word-break:keep-all; }

  /* ── 과목 리스트 (동격 4과목: 카드 유지, 위계·간격 정제) ── */
  .hub-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin:28px 0 8px; }
  .hub-card {
    position:relative; display:flex; flex-direction:column; gap:0;
    padding:22px 22px 18px; border:var(--c-border); border-radius:16px;
    background:var(--c-surface); box-shadow:var(--c-shadow);
    text-decoration:none; color:inherit; cursor:pointer;
    transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease;
  }
  .hub-card:hover { transform:translateY(-3px); box-shadow:var(--c-shadow-hover); border-color:var(--c-accent); }
  .hub-card.locked { opacity:0.6; cursor:default; }
  .hub-card.locked:hover { transform:none; box-shadow:var(--c-shadow); border-color:var(--c-border-soft); }

  .hub-card .card-head { display:flex; align-items:center; gap:12px; }
  .hub-card .emoji {
    font-size:24px; line-height:1; width:44px; height:44px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px; background:var(--c-surface-2);
  }
  .hub-card .title { font-size:19px; font-weight:800; letter-spacing:-0.02em; color:var(--c-heading); }
  .hub-card .sub { color:var(--c-text); font-size:13.5px; line-height:1.55; margin:12px 0 16px; word-break:keep-all; }
  .hub-card .actions { display:flex; gap:8px; margin-top:auto; }
  .hub-card .actions a {
    flex:1; text-align:center; padding:9px 12px; border-radius:10px;
    font-size:13.5px; font-weight:700; text-decoration:none;
    border:1px solid var(--c-border-soft); color:var(--c-heading);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .hub-card .actions a.primary { background:var(--c-accent); color:#fff; border-color:var(--c-accent); }
  .hub-card .actions a.primary:hover { background:var(--c-accent-strong); border-color:var(--c-accent-strong); }
  .hub-card .actions a.ghost { background:transparent; }
  .hub-card .actions a.ghost:hover { background:var(--c-surface-2); border-color:var(--c-border); }
  .hub-card .actions a.disabled { opacity:0.4; pointer-events:none; }
  .hub-card .badge-wip {
    position:absolute; top:16px; right:16px;
    font-family:"JetBrains Mono", ui-monospace, monospace;
    font-size:10.5px; font-weight:600; letter-spacing:0.02em;
    padding:3px 8px; border-radius:7px;
    background:var(--c-surface-2); color:var(--c-text);
  }

  @media (max-width:640px) {
    .home-hero { padding:32px 0 4px; }
    .hub-grid { grid-template-columns:1fr; gap:12px; }
  }
</style>
</head>
<body>
<div class="page">

<header class="app-header">
  <div class="brand">
    <div class="brand-title">AI Study Hub</div>
    <div class="brand-sub">복습 · 모의고사 · 랭킹</div>
  </div>
  <div class="header-actions">
    <button id="theme-toggle" class="btn-icon" aria-label="테마 전환" onclick="window.__theme.toggleTheme()">☾</button>
  </div>
</header>

<main class="container">

  <section class="home-hero">
    <div class="home-kicker"><span class="dot" aria-hidden="true"></span>AI STUDY HUB · 2026</div>
    <h1>학습할 과목을 선택하세요</h1>
    <p>강의 노트를 복습하고, 모의고사로 점검하고, 실시간 랭킹으로 비교하세요.</p>
  </section>

  <section class="hub-grid" id="hub-grid">
    <!-- JS 렌더 -->
  </section>

  <section style="margin-top:56px; padding:24px; border-top:1px dashed var(--c-border-soft); text-align:center;">
    <div class="muted small">
      SW AI 융합정보대학원 61기 최경찬 · <a href="mailto:repairer5812@gmail.com" style="color:inherit;text-decoration:underline;">repairer5812@gmail.com</a><br>
      학습 목적 비영리 프로젝트 · 문제는 강의 노트·슬라이드 기반으로 작성된 복습용 연습 문제입니다
    </div>
  </section>

</main>

</div>

<script type="module" src="js/theme.js"></script>
<script type="module">
  import { getAllSubjectMetas } from "./js/subjects/index.js";

  const grid = document.getElementById("hub-grid");
  const metas = getAllSubjectMetas();

  grid.innerHTML = metas.map(m => {
    const locked = !m.available;
    const examHref = m.hasExam ? `subject.html?s=${m.id}` : "#";
    const reviewHref = m.noteIndex.length ? `review.html?s=${m.id}` : "#";
    const examClass = m.hasExam ? "primary" : "primary disabled";
    const reviewClass = m.noteIndex.length ? "ghost" : "ghost disabled";
    const wipText = locked ? "자료 준비중" : (m.hasExam ? "" : "시험 준비중");
    return `
      <div class="hub-card ${locked ? "locked" : ""}" data-review="${reviewHref}" role="group" aria-label="${m.title}">
        ${wipText ? `<span class="badge-wip">${wipText}</span>` : ""}
        <div class="card-head">
          <span class="emoji" aria-hidden="true">${m.emoji}</span>
          <div class="title">${m.title}</div>
        </div>
        <div class="sub">${m.subtitle}</div>
        <div class="actions">
          <a class="${reviewClass}" href="${reviewHref}">📖 복습</a>
          <a class="${examClass}" href="${examHref}">📝 모의고사</a>
        </div>
      </div>`;
  }).join("");

  // 카드 본체(버튼 외 영역) 클릭 시 복습으로 이동
  grid.querySelectorAll(".hub-card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;                  // 버튼 클릭은 기본 동작 유지
      const href = card.dataset.review;
      if (href && href !== "#" && !card.classList.contains("locked")) location.href = href;
    });
  });
</script>

</body>
</html>
